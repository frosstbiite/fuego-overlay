name: Build Fuego Overlay v1.1 Test

on:
  workflow_dispatch:
  push:
    branches:
      - v1.1-splash-screen
    paths:
      - 'src/**'
      - 'electron/**'
      - 'server/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-v1.1-test.yml'
  pull_request:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Fuego Overlay
        run: npm run build

      - name: Build Windows package
        run: npx electron-builder --win --x64

      - name: Upload Windows test build
        uses: actions/upload-artifact@v4
        with:
          name: Fuego-Overlay-v1.1.0-Windows-Test
          path: |
            release/Fuego-Overlay-Setup-1.1.0.exe
            release/Fuego-Overlay-Setup-1.1.0.exe.blockmap
            release/win-unpacked/**
          if-no-files-found: error
