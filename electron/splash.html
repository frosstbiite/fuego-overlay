<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fuego Software</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #020712;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #020712;
      user-select: none;
    }

    .splash {
      position: relative;
      width: 100%;
      height: 100%;
      background:
        url("./fuego-splash.webp") center center / cover no-repeat,
        #020712;
    }

    .startup-panel {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 29%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 4.5%;
      background: linear-gradient(
        to bottom,
        rgba(2, 7, 18, 0.1) 0%,
        rgba(2, 7, 18, 0.94) 35%,
        rgba(2, 7, 18, 1) 72%
      );
    }

    .version {
      margin-bottom: 18px;
      color: #ffd322;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-shadow: 0 0 18px rgba(255, 203, 0, 0.35);
    }

    .progress-shell {
      width: 51%;
      height: 18px;
      padding: 2px;
      border: 2px solid rgba(74, 119, 255, 0.8);
      border-radius: 999px;
      background: rgba(2, 7, 18, 0.85);
      box-shadow:
        0 0 16px rgba(0, 113, 255, 0.28),
        inset 0 0 8px rgba(0, 0, 0, 0.8);
      overflow: hidden;
    }

    .progress-bar {
      width: 6%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(
        90deg,
        #0a8cff 0%,
        #21b6ff 38%,
        #f4f6ff 58%,
        #ffcf19 82%,
        #ffc400 100%
      );
      box-shadow:
        0 0 15px rgba(0, 137, 255, 0.8),
        0 0 20px rgba(255, 199, 0, 0.55);
      transition: width 280ms ease-out;
    }

    .status {
      margin-top: 18px;
      color: rgba(255, 255, 255, 0.84);
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      text-shadow: 0 0 12px rgba(58, 147, 255, 0.35);
    }

    .detail {
      min-height: 18px;
      margin-top: 8px;
      color: rgba(255, 255, 255, 0.48);
      font-size: 11px;
      letter-spacing: 0.08em;
    }

    .fade-out {
      animation: fadeOut 360ms ease forwards;
    }

    @keyframes fadeOut {
      to {
        opacity: 0;
      }
    }
  </style>
</head>
<body>
  <main class="splash" aria-label="Fuego Overlay startup">
    <section class="startup-panel">
      <div id="version" class="version">FUEGO OVERLAY</div>
      <div class="progress-shell" aria-hidden="true">
        <div id="progress" class="progress-bar"></div>
      </div>
      <div id="status" class="status">Initializing...</div>
      <div id="detail" class="detail"></div>
    </section>
  </main>

  <script>
    const progressElement = document.getElementById('progress')
    const statusElement = document.getElementById('status')
    const detailElement = document.getElementById('detail')
    const versionElement = document.getElementById('version')

    window.updateSplash = ({ progress, status, detail = '', version = '' }) => {
      const safeProgress = Math.max(0, Math.min(100, Number(progress) || 0))
      progressElement.style.width = `${safeProgress}%`
      statusElement.textContent = status || 'Initializing...'
      detailElement.textContent = detail
      if (version) versionElement.textContent = version
    }

    window.finishSplash = () => {
      document.body.classList.add('fade-out')
    }
  </script>
</body>
</html>
